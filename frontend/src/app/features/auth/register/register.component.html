<div style="height:100vh; overflow:hidden; position:relative; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:0.75rem; padding:1rem;" class="z-content">

  <!-- Botón volver al inicio + tema -->
  <div style="position: absolute; top: 1rem; left: 1rem; z-index: 10; display: flex; align-items: center; gap: 0.75rem;">
    <a routerLink="/"
      style="display: inline-flex; align-items: center; gap: 0.4rem; font-family: 'Cinzel', serif; font-size: 0.8rem; font-weight: 700; color: #92400e; background: rgba(255,255,255,0.85); border: 1.5px solid rgba(180,83,9,0.35); border-radius: 999px; padding: 0.4rem 1rem; backdrop-filter: blur(8px); text-decoration: none; transition: background 0.2s, color 0.2s;"
      onmouseover="this.style.background='rgba(251,191,36,0.25)'; this.style.color='#78350f';"
      onmouseout="this.style.background='rgba(255,255,255,0.85)'; this.style.color='#92400e';">
      ← Volver al inicio
    </a>
    <app-theme-toggle />
  </div>

  <!-- Logo + título compacto -->
  <div style="text-align:center;">
    <div style="display:flex;justify-content:center;margin-bottom:0.25rem;">
      <img src="assets/imagensinfondo.png" alt="LegendaryClass" style="height:75px;width:auto;filter:drop-shadow(0 0 12px rgba(217,119,6,0.4));">
    </div>
    <h1 style="font-family: 'Cinzel Decorative', serif; font-weight: 900; font-size: clamp(1.6rem, 3.5vw, 2.5rem); background: linear-gradient(45deg, #b45309, #d97706, #f59e0b, #fbbf24); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 0.1em; margin: 0;">
      LEGENDARYCLASS
    </h1>
    <p style="font-family: 'Cinzel', serif; font-size: 0.7rem; color: #92400e; letter-spacing: 0.05em; margin: 0.2rem 0 0;">
      ⚔️ Únete a la Leyenda ⚔️
    </p>
  </div>

  <!-- Formulario -->
  <div class="w-full max-w-sm mx-4 sm:mx-auto">
    <div class="legendary-card p-5 w-full">

      <div class="text-center mb-3">
        <h2 class="font-cinzel font-bold text-base text-gray-800 dark:text-slate-100 uppercase tracking-wide">✨ Crear Cuenta</h2>
        <p class="text-gray-500 dark:text-slate-400 text-xs font-playfair">Únete al Portal de Aventureros</p>
      </div>

      @if (error()) {
        <div class="bg-red-50 dark:bg-red-900/20 border-l-4 border-red-500 text-red-700 dark:text-red-400 rounded-lg p-2 mb-3 text-xs font-playfair">
          {{ error() }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-2">

        <div>
          <label for="reg-name" class="block font-cinzel text-xs font-bold text-gray-600 dark:text-slate-300 uppercase tracking-wide mb-0.5">Nombre Completo</label>
          <input id="reg-name" type="text" formControlName="name" placeholder="Tu nombre completo" class="input-epic" />
        </div>

        <div>
          <label for="reg-email" class="block font-cinzel text-xs font-bold text-gray-600 dark:text-slate-300 uppercase tracking-wide mb-0.5">Correo Electrónico</label>
          <input id="reg-email" type="email" formControlName="email" placeholder="tu&#64;email.com" class="input-epic" />
        </div>

        <div>
          <label for="reg-password" class="block font-cinzel text-xs font-bold text-gray-600 dark:text-slate-300 uppercase tracking-wide mb-0.5">Contraseña</label>
          <input id="reg-password" type="password" formControlName="password" placeholder="Mínimo 8 caracteres" class="input-epic" />
        </div>

        <div>
          <span class="block font-cinzel text-xs font-bold text-gray-600 dark:text-slate-300 uppercase tracking-wide mb-1">Tipo de Aventurero</span>
          <div class="grid grid-cols-3 gap-2">
            @for (role of roles; track role.value) {
              <button type="button" (click)="form.patchValue({ role: role.value })"
                class="flex flex-col items-center py-2 rounded-xl border-2 transition-all duration-200 cursor-pointer"
                [ngClass]="form.get('role')?.value === role.value
                  ? 'border-amber-400 bg-amber-50 dark:bg-amber-900/30 dark:border-amber-500 shadow-md'
                  : 'border-gray-200 dark:border-slate-600 bg-white dark:bg-slate-700'">
                <span class="text-xl">{{ role.icon }}</span>
                <span class="font-cinzel text-xs font-bold mt-0.5 uppercase tracking-wide"
                  [ngClass]="form.get('role')?.value === role.value ? 'text-amber-700 dark:text-amber-400' : 'text-gray-600 dark:text-slate-300'">
                  {{ role.label }}
                </span>
              </button>
            }
          </div>
        </div>

        <button type="submit" [disabled]="loading() || form.invalid"
          class="btn-epic btn-green w-full py-2.5 text-sm disabled:opacity-50 disabled:cursor-not-allowed">
          @if (loading()) {
            <span class="flex items-center justify-center gap-2">
              <span class="animate-spin-slow">✨</span> Creando cuenta...
            </span>
          } @else {
            ✨ COMENZAR AVENTURA LEGENDARIA
          }
        </button>

      </form>

      <div class="mt-3 pt-3 border-t border-gray-100 dark:border-slate-700 text-center">
        <p class="font-playfair text-xs text-slate-600 dark:text-slate-300">
          ¿Ya tienes cuenta?
          <a routerLink="/auth/login"
            class="font-cinzel font-semibold text-gray-700 dark:text-slate-200 hover:text-gray-900 ml-1 transition-colors"
            style="text-decoration: underline; text-decoration-color: rgba(59,130,246,0.6);">
            ⚔️ Iniciar sesión
          </a>
        </p>
      </div>
    </div>
  </div>

  <!-- Footer fijo -->
  <div style="position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); color: #6b7280; font-size: 0.75rem; text-align: center; font-family: 'Cinzel', serif; background: rgba(255,255,255,0.8); padding: 0.5rem 1rem; border-radius: 20px; backdrop-filter: blur(10px); white-space: nowrap;">
    🏰 LegendaryClass v2.0 🏰
  </div>

</div>
